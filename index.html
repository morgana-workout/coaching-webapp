    <style>
html body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
* { -webkit-tap-highlight-color: transparent; }
button, a, input, select, textarea { transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s, opacity .15s; }
button { touch-action: manipulation; }
button:active:not(:disabled) { transform: scale(.97); }
input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(63,120,179,.22); }
@keyframes appEntra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#root > * { animation: appEntra .26s ease-out; }
@keyframes appPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.97); } }
@keyframes appShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk { border-radius: 12px; background: linear-gradient(90deg, #E6EFF8 25%, #F4F8FC 50%, #E6EFF8 75%); background-size: 200% 100%; animation: appShimmer 1.4s linear infinite; }
@media (prefers-reduced-motion: reduce) { #root *, #root *::before, #root *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
#splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2147483000; background: #fff; overflow: hidden; }
html { background: #fff; }
#splash .lg { opacity: 0; transition: opacity 260ms ease-out; position: absolute; top: 50%; left: 50%; width: 190px; height: 127px; margin: -63px 0 0 -95px; }
#splash img { display: block; width: 100%; height: 100%; max-width: none; object-fit: contain; will-change: transform, opacity; transform: translateZ(0); backface-visibility: hidden; }
#splash.on .lg, #splash.esce .lg { opacity: 1; }
#splash.esce { animation: spVia 1100ms cubic-bezier(.4,0,.2,1) forwards; pointer-events: none; }
@keyframes spVia { 0% { opacity: 1; } 35% { opacity: 1; } 100% { opacity: 0; } }
#splash.esce img { animation: spZoom 1100ms cubic-bezier(.3,0,.2,1) forwards; }
@keyframes spZoom { 0% { transform: translateZ(0) scale(1); opacity: 1; } 100% { transform: translateZ(0) scale(8); opacity: 0; } }

    <script>
      // Schermata di apertura: il logo compare già fermo al centro (appena lo schermo si è assestato),
      // resta ~1,5 s, poi si ingrandisce e svanisce (effetto "Netflix")
      (function () {
        var el = document.getElementById("splash");
        var root = document.getElementById("root");
        var rivelato = 0, uscito = false;
        function misura() { var v = window.visualViewport; return window.innerWidth + "x" + window.innerHeight + "x" + (v ? Math.round(v.height) : 0); }
        function mostra() { if (rivelato || !el) return; rivelato = Date.now(); el.classList.add("on"); }
        // aspetta che le dimensioni dello schermo siano stabili (barre del browser), poi mostra il logo
        var ultima = misura(), stabili = 0, giri = 0;
