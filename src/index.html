<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Coaching by Morgana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
html body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
* { -webkit-tap-highlight-color: transparent; }
button, a, input, select, textarea { transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s, opacity .15s; }
button { touch-action: manipulation; }
button:active:not(:disabled) { transform: scale(.97); }
input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(63,120,179,.22); }
@keyframes appEntra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#root > * { animation: appEntra .26s ease-out; }
@keyframes appPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.97); } }
@keyframes appShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk { border-radius: 12px; background: linear-gradient(90deg, #E6EFF8 25%, #F4F8FC 50%, #E6EFF8 75%); background-size: 200% 100%; animation: appShimmer 1.4s linear infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;">
        <img src="/logo.png" alt="" style="width:170px;height:auto;animation:appPulse 1.6s ease-in-out infinite;" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
